<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOX Dash · Telas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0b0d;--panel:#111316;--line:#1f2328;--hi:#f2f4f5;--mid:#a3aab3;--low:#6b737d;--acc:#2bb38a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--hi);font:14px/1.45 Inter,system-ui,sans-serif}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:600;font-size:15px;padding:0 10px 4px}.sub{color:var(--low);font-size:12px;padding:0 10px 14px}
.master{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 4px 6px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:12.5px;color:var(--mid)}
.master b{display:block;color:var(--hi);font-weight:500;font-size:13px}
h4{margin:18px 10px 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--low);font-weight:600}
.it{display:flex;align-items:center;gap:6px;border-radius:8px}
.it a{flex:1;min-width:0;display:block;padding:7px 10px;border-radius:8px;color:var(--mid);text-decoration:none}
.it:hover{background:var(--panel)}.it:hover a{color:var(--hi)}.it.on{background:#123a2e}.it.on a{color:#6fe3bd}
.tg{display:inline-flex;align-items:center;gap:6px;margin-right:8px;cursor:pointer;user-select:none;font-size:11px;color:var(--low);background:none;border:0;padding:0;font-family:inherit}
.tg .sw{width:30px;height:17px;border-radius:9px;background:#2a2f36;position:relative;transition:background .15s}
.tg .sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#cfd5db;transition:transform .15s}
.tg[aria-checked="true"] .sw{background:var(--acc)}.tg[aria-checked="true"] .sw::after{transform:translateX(13px);background:#fff}
.tg[aria-checked="true"]{color:#6fe3bd}
.tg:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:9px}
main{padding:22px 28px 60px;min-width:0}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.top h1{margin:0;font-size:20px;font-weight:600}.rota{color:var(--low);font-family:ui-monospace,monospace;font-size:12px}
.ver{font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mid)}
.ver.novo{background:#123a2e;border-color:#1f5a47;color:#6fe3bd}
.nav{margin-left:auto;display:flex;gap:8px}.nav button{background:var(--panel);border:1px solid var(--line);color:var(--hi);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.nav button:hover{border-color:#2f353c}
.shot{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#000;max-width:1440px}
.shot.m{max-width:390px}.shot img{display:block;width:100%;height:auto}
.dica{color:var(--low);font-size:12px;margin-top:12px}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}main{padding:16px}}
</style></head><body>
<div class="app"><aside><div class="brand">VOX Dash</div><div class="sub">Telas com dados fictícios · 18/11/2026</div>
<div class="master"><span><b>Layout novo</b>em todas as telas alteradas</span><button class="tg" id="all" role="switch" aria-label="Layout novo em todas as telas"><span class="sw"></span></button></div>
<nav id="menu"></nav></aside>
<main><div class="top"><h1 id="t"></h1><span class="ver" id="v" hidden></span><span class="rota" id="r"></span><div class="nav"><button id="ant">← Anterior</button><button id="prox">Próxima →</button></div></div>
<div class="shot" id="s"><img id="i" alt=""></div><div class="dica">Telas com chave na coluna têm duas versões: ligada mostra o layout novo, desligada o antigo. Para pedir um ajuste, diga o nome da tela e o que mudar.</div></main></div>
<script>
const D=[{"id": "painel-dashboard", "grupo": "Painel do lojista", "titulo": "Dashboard", "rota": "/painel", "img": "telas/painel-dashboard.webp", "w": 1440, "h": 2800, "mobile": false, "antigo": {"img": "telas/painel-dashboard-antigo.webp", "w": 1440, "h": 1708}}, {"id": "painel-inicio", "grupo": "Painel do lojista", "titulo": "Início", "rota": "/painel/inicio", "img": "telas/painel-inicio.webp", "w": 1440, "h": 1024, "mobile": false}, {"id": "painel-vendas", "grupo": "Painel do lojista", "titulo": "Vendas", "rota": "/painel/vendas", "img": "telas/painel-vendas.webp", "w": 1440, "h": 1024, "mobile": false}, {"id": "painel-carrinhos", "grupo": "Painel do lojista", "titulo": "Carrinhos abandonados", "rota": "/painel/carrinhos", "img": "telas/painel-carrinhos.webp", "w": 1440, "h": 1038, "mobile": false}, {"id": "painel-desempenho", "grupo": "Painel do lojista", "titulo": "Desempenho", "rota": "/painel/desempenho", "img": "telas/painel-desempenho.webp", "w": 1440, "h": 1024, "mobile": false}, {"id": "painel-dispositivos", "grupo": "Painel do lojista", "titulo": "Dispositivos", "rota": "/painel/dispositivos", "img": "telas/painel-dispositivos.webp", "w": 1440, "h": 1024, "mobile": false}, {"id": "painel-produtos", "grupo": "Painel do lojista", "titulo": "Produtos", "rota": "/painel/produtos", "img": "telas/painel-produtos.webp", "w": 1440, "h": 1024, "mobile": false}, {"id": "painel-criptografia", "grupo": "Painel do lojista", "titulo": "Criptografia", "rota": "/painel/criptografia", "img": "telas/painel-criptografia.webp", "w": 1440, "h": 1090, "mobile": false}, {"id": "painel-cupons", "grupo": "Painel do lojista", "titulo": "Cupons", "rota": "/painel/cupons", "img": "telas/painel-cupons.webp", "w": 1440, "h": 1024, "mobile": false}, {"id": "painel-order-bump", "grupo": "Painel do lojista", "titulo": "Order bump", "rota": "/painel/order-bump", "img": "telas/painel-order-bump.webp", "w": 1440, "h": 1024, "mobile": false}, {"id": "painel-provas-sociais", "grupo": "Painel do lojista", "titulo": "Provas sociais", "rota": "/painel/provas-sociais", "img": "telas/painel-provas-sociais.webp", "w": 1440, "h": 1024, "mobile": false}, {"id": "painel-personalizar", "grupo": "Painel do lojista", "titulo": "Personalizar checkout", "rota": "/painel/personalizar", "img": "telas/painel-personalizar.webp", "w": 1440, "h": 1024, "mobile": false}, {"id": "painel-pagamentos", "grupo": "Painel do lojista", "titulo": "Pagamentos", "rota": "/painel/pagamentos", "img": "telas/painel-pagamentos.webp", "w": 1440, "h": 1419, "mobile": false}, {"id": "painel-pixels", "grupo": "Painel do lojista", "titulo": "Pixels", "rota": "/painel/pixels", "img": "telas/painel-pixels.webp", "w": 1440, "h": 1024, "mobile": false}, {"id": "painel-emails", "grupo": "Painel do lojista", "titulo": "E-mails", "rota": "/painel/emails", "img": "telas/painel-emails.webp", "w": 1440, "h": 1715, "mobile": false}, {"id": "painel-webhooks", "grupo": "Painel do lojista", "titulo": "Webhooks", "rota": "/painel/webhooks", "img": "telas/painel-webhooks.webp", "w": 1440, "h": 1024, "mobile": false}, {"id": "painel-dominio", "grupo": "Painel do lojista", "titulo": "Domínio", "rota": "/painel/dominio", "img": "telas/painel-dominio.webp", "w": 1440, "h": 1024, "mobile": false}, {"id": "painel-shopify", "grupo": "Painel do lojista", "titulo": "Shopify", "rota": "/painel/shopify", "img": "telas/painel-shopify.webp", "w": 1440, "h": 1024, "mobile": false}, {"id": "painel-apps", "grupo": "Painel do lojista", "titulo": "Apps", "rota": "/painel/apps", "img": "telas/painel-apps.webp", "w": 1440, "h": 1024, "mobile": false}, {"id": "painel-taxas", "grupo": "Painel do lojista", "titulo": "Taxas", "rota": "/painel/taxas", "img": "telas/painel-taxas.webp", "w": 1440, "h": 1024, "mobile": false}, {"id": "painel-plano", "grupo": "Painel do lojista", "titulo": "Plano", "rota": "/painel/plano", "img": "telas/painel-plano.webp", "w": 1440, "h": 1024, "mobile": false}, {"id": "painel-seguranca", "grupo": "Painel do lojista", "titulo": "Segurança", "rota": "/painel/seguranca", "img": "telas/painel-seguranca.webp", "w": 1440, "h": 2548, "mobile": false}, {"id": "painel-configuracoes", "grupo": "Painel do lojista", "titulo": "Configurações", "rota": "/painel/configuracoes", "img": "telas/painel-configuracoes.webp", "w": 1440, "h": 1024, "mobile": false}, {"id": "painel-detalhe-venda", "grupo": "Painel do lojista", "titulo": "Detalhe da venda", "rota": "/painel/vendas/101044fc-720e-4f02-a70a-a1bbfcc3d4ec", "img": "telas/painel-detalhe-venda.webp", "w": 1440, "h": 1024, "mobile": false}, {"id": "painel-caixa-de-emails", "grupo": "Painel do lojista", "titulo": "Caixa de e-mails", "rota": "/painel/emails/caixa", "img": "telas/painel-caixa-de-emails.webp", "w": 1440, "h": 1090, "mobile": false}, {"id": "admin-visao-geral", "grupo": "Admin da plataforma", "titulo": "Visão geral", "rota": "/admin", "img": "telas/admin-inicio.webp", "w": 1440, "h": 1430, "mobile": false}, {"id": "admin-lojas", "grupo": "Admin da plataforma", "titulo": "Lojas", "rota": "/admin/lojas", "img": "telas/admin-lojas.webp", "w": 1440, "h": 900, "mobile": false}, {"id": "admin-usuarios", "grupo": "Admin da plataforma", "titulo": "Usuários", "rota": "/admin/usuarios", "img": "telas/admin-usuarios.webp", "w": 1440, "h": 900, "mobile": false}, {"id": "admin-clientes", "grupo": "Admin da plataforma", "titulo": "Clientes", "rota": "/admin/clientes", "img": "telas/admin-clientes.webp", "w": 1440, "h": 1958, "mobile": false}, {"id": "admin-transacoes", "grupo": "Admin da plataforma", "titulo": "Transações", "rota": "/admin/transacoes", "img": "telas/admin-transacoes.webp", "w": 1440, "h": 1994, "mobile": false}, {"id": "admin-taxas", "grupo": "Admin da plataforma", "titulo": "Taxas", "rota": "/admin/taxas", "img": "telas/admin-taxas.webp", "w": 1440, "h": 900, "mobile": false}, {"id": "admin-assinaturas", "grupo": "Admin da plataforma", "titulo": "Assinaturas", "rota": "/admin/assinaturas", "img": "telas/admin-assinaturas.webp", "w": 1440, "h": 900, "mobile": false}, {"id": "admin-relatorios", "grupo": "Admin da plataforma", "titulo": "Relatórios", "rota": "/admin/relatorios", "img": "telas/admin-relatorios.webp", "w": 1440, "h": 907, "mobile": false}, {"id": "admin-emails", "grupo": "Admin da plataforma", "titulo": "E-mails", "rota": "/admin/emails", "img": "telas/admin-emails.webp", "w": 1440, "h": 900, "mobile": false}, {"id": "admin-configuracoes", "grupo": "Admin da plataforma", "titulo": "Configurações", "rota": "/admin/configuracoes", "img": "telas/admin-configuracoes.webp", "w": 1440, "h": 1286, "mobile": false}, {"id": "celular-dashboard", "grupo": "Painel no celular", "titulo": "Dashboard", "rota": "/painel", "img": "telas/celular-dashboard.webp", "w": 390, "h": 4341, "mobile": true, "antigo": {"img": "telas/celular-dashboard-antigo.webp", "w": 390, "h": 2945}}, {"id": "celular-inicio", "grupo": "Painel no celular", "titulo": "Início", "rota": "/painel/inicio", "img": "telas/celular-inicio.webp", "w": 390, "h": 2208, "mobile": true}, {"id": "celular-vendas", "grupo": "Painel no celular", "titulo": "Vendas", "rota": "/painel/vendas", "img": "telas/celular-vendas.webp", "w": 390, "h": 1410, "mobile": true}, {"id": "acesso-login", "grupo": "Acesso", "titulo": "Login", "rota": "/login", "img": "telas/acesso-login.webp", "w": 1440, "h": 900, "mobile": false}];
const st={};D.forEach(d=>{if(d.antigo)st[d.id]=true});
try{const s=JSON.parse(localStorage.getItem('voxdash-layout')||'{}');for(const k in s)if(k in st)st[k]=!!s[k]}catch(e){}
function save(){try{localStorage.setItem('voxdash-layout',JSON.stringify(st))}catch(e){}}
const menu=document.getElementById('menu');let g='';
D.forEach(d=>{if(d.grupo!==g){g=d.grupo;const h=document.createElement('h4');h.textContent=g;menu.appendChild(h)}
const row=document.createElement('div');row.className='it';row.dataset.id=d.id;
const a=document.createElement('a');a.href='#'+d.id;a.textContent=d.titulo;row.appendChild(a);
if(d.antigo){const b=document.createElement('button');b.className='tg';b.setAttribute('role','switch');b.dataset.id=d.id;
b.setAttribute('aria-label','Layout novo: '+d.titulo);b.innerHTML='<span class="lb"></span><span class="sw"></span>';
b.onclick=()=>{st[d.id]=!st[d.id];save();if(location.hash.slice(1)!==d.id)location.hash=d.id;else show()};row.appendChild(b)}
menu.appendChild(row)});
const all=document.getElementById('all');
all.onclick=()=>{const v=!Object.values(st).every(Boolean);for(const k in st)st[k]=v;save();show()};
function sync(){menu.querySelectorAll('.tg').forEach(b=>{const on=st[b.dataset.id];b.setAttribute('aria-checked',on);b.querySelector('.lb').textContent=on?'novo':'antigo'});
all.setAttribute('aria-checked',Object.values(st).every(Boolean))}
function show(){const id=location.hash.slice(1);let k=D.findIndex(d=>d.id===id);if(k<0)k=0;const d=D[k];
const novo=!d.antigo||st[d.id];const src=novo?d:d.antigo;
document.getElementById('t').textContent=d.grupo+' · '+d.titulo;document.getElementById('r').textContent=d.rota;
const v=document.getElementById('v');v.hidden=!d.antigo;v.textContent=novo?'Layout novo':'Layout antigo';v.className='ver'+(novo?' novo':'');
const i=document.getElementById('i');i.src=src.img;i.width=src.w;i.height=src.h;i.alt=d.titulo+(d.antigo?(novo?' (layout novo)':' (layout antigo)'):'');
document.getElementById('s').className='shot'+(d.mobile?' m':'');
menu.querySelectorAll('.it').forEach(r=>r.classList.toggle('on',r.dataset.id===d.id));sync();
document.getElementById('ant').onclick=()=>location.hash=D[(k-1+D.length)%D.length].id;
document.getElementById('prox').onclick=()=>location.hash=D[(k+1)%D.length].id}
let last='';addEventListener('hashchange',()=>{show();if(location.hash!==last){window.scrollTo(0,0);last=location.hash}});
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button'))return;if(e.key==='ArrowRight')document.getElementById('prox').click();if(e.key==='ArrowLeft')document.getElementById('ant').click()});
show();
</script></body></html>
